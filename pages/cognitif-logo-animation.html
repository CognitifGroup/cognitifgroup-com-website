<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cognitif Group logo animation</title>
  <script src="js/theme.js?v=1"></script>
  <style>
    :root {
      --fx-line: 24,32,64;
      --fx-accent: 160,95,60;
      --fx-bg: 247,242,229;
    }
    html[data-theme="dark"] {
      --fx-line: 247,242,229;
      --fx-accent: 198,123,82;
      --fx-bg: 13,20,40;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; color-scheme: normal !important; background: transparent !important; }
    canvas { display: block; width: 100%; height: 100%; background: transparent !important; }
  </style>
</head>
<body>
  <canvas data-hero-fx="cognitif" aria-hidden="true"></canvas>
<script src="js/cognitif-logo-animation.js?v=32"></script>
</body>
</html>
